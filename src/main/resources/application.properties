spring.application.name=eCommerce-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

admin.email=${ADMIN_EMAIL:admin@email.com}
admin.password=${ADMIN_PASSWORD}

logging.level.com.lautarorisso.eCommerce_api=INFO

rate.limit.login.max-attempts=${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
rate.limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
rate.limit.register.max-attempts=${RATE_LIMIT_REGISTER_MAX_ATTEMPTS:5}
rate.limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:60}
rate.limit.order.max-attempts=${RATE_LIMIT_ORDER_MAX_ATTEMPTS:10}
rate.limit.order.window-seconds=${RATE_LIMIT_ORDER_WINDOW_SECONDS:60}
rate.limit.restock.max-attempts=${RATE_LIMIT_RESTOCK_MAX_ATTEMPTS:10}
rate.limit.restock.window-seconds=${RATE_LIMIT_RESTOCK_WINDOW_SECONDS:60}
